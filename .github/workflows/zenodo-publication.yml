name: Archive verified manuscript release on Zenodo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        file:
          - analysis_inputs_and_checkpoints.zip
          - raw_spk_DIV21.zip
          - raw_spk_DIV28.zip
          - raw_spk_DIV35.zip
          - raw_spk_DIV42.zip
          - raw_spk_DIV56.zip
          - raw_spk_DIV63.zip
    steps:
      - uses: actions/checkout@v4
      - name: Install transfer dependency
        run: python3 -m pip install --quiet requests
      - name: Verify and transfer byte-identical portable ZIP volumes
        env:
          ZENODO_ARCHIVE_TOKEN: ${{ secrets.ZENODO_MANUSCRIPT_ARCHIVE_TOKEN }}
          GH_ARCHIVE_VERIFICATION_TOKEN: ${{ github.token }}
        run: python3 -u .github/scripts/zenodo_portable.py --original "${{ matrix.file }}"
